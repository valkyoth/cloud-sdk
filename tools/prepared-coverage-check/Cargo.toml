[package]
name = "cloud-sdk-prepared-coverage-check"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
default-run = "cloud-sdk-prepared-coverage-check"

[dependencies]
saphyr = { version = "=0.0.12", default-features = false }
saphyr-parser = { version = "=0.0.12", default-features = false }
syn = { version = "=3.0.4", default-features = false, features = ["full", "parsing", "visit"] }

[workspace]

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use = "deny"

[lints.clippy]
panic = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
undocumented_unsafe_blocks = "forbid"
