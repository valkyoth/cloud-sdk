[package]
name = "cloud-sdk-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
cloud-sdk = { path = "../crates/cloud-sdk", version = "=0.78.0" }
cloud-sdk-hetzner = { path = "../crates/cloud-sdk-hetzner", version = "=0.42.0", features = ["serde"] }
cloud-sdk-reqwest = { path = "../crates/cloud-sdk-reqwest", version = "=0.35.0", default-features = false, features = ["fuzzing"] }
libfuzzer-sys = "0.4.13"
serde_json = "1.0.151"

[[bin]]
name = "buffer_writers"
path = "fuzz_targets/buffer_writers.rs"
test = false
doc = false
bench = false

