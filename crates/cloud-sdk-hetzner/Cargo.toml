[package]
name = "cloud-sdk-hetzner"
description = "no_std-first Hetzner provider crate for cloud-sdk."
version = "0.45.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
alloc = ["cloud-sdk/alloc", "cloud-sdk-sanitization/alloc"]
serde = [
    "alloc",
    "dep:base64-ng",
    "dep:md-5",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "cloud-sdk-sanitization/alloc",
]
std = ["alloc", "cloud-sdk/std"]

[dependencies]
cloud-sdk.workspace = true
cloud-sdk-sanitization.workspace = true
base64-ng = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
cloud-sdk-reqwest = { workspace = true, features = ["blocking-rustls"] }
cloud-sdk-sanitization.workspace = true
cloud-sdk-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "live_smoke"
required-features = ["serde"]

[[test]]
name = "vertical_execution"
required-features = ["serde"]

[[test]]
name = "client_foundation"
required-features = ["serde"]

[[test]]
name = "cloud_client_unpolled_cleanup"
required-features = ["serde"]

[[test]]
name = "dns_client"
required-features = ["serde"]

[[test]]
name = "dns_client_unpolled_cleanup"
required-features = ["serde"]

[[test]]
name = "security_client"
required-features = ["serde"]

[[test]]
name = "security_client_unpolled_cleanup"
required-features = ["serde"]

[[test]]
name = "storage_client"
required-features = ["serde"]

[[test]]
name = "storage_client_unpolled_cleanup"
required-features = ["serde"]

[[test]]
name = "robot_client"
required-features = ["serde"]

[[test]]
name = "robot_client_dispatch"
required-features = ["serde"]

[[example]]
name = "action_polling"
required-features = ["serde"]

[[example]]
name = "pagination"
required-features = ["serde"]

[[example]]
name = "checked_response"
required-features = ["serde"]

[[example]]
name = "cloud_client"
required-features = ["serde"]

[[example]]
name = "dns_client"
required-features = ["serde"]

[[example]]
name = "security_client"
required-features = ["serde"]

[[example]]
name = "storage_client"
required-features = ["serde"]

