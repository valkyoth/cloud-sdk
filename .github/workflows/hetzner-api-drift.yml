name: Hetzner API Drift

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetzner-api-drift
  cancel-in-progress: false

jobs:
  compare-source-lock:
    name: Compare official specs to source lock
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare official Hetzner API specs
        run: scripts/check_hetzner_api_drift.py --fetch
