[policy]
version = 1
repository = "valkyoth/cloud-sdk"
default_branch = "main"
codeql_setup = "default"
codeql_state = "configured"
codeql_schedule = "weekly"
codeql_languages = ["actions", "python", "rust"]
workflow_default_permissions = "read"
workflow_can_approve_pull_requests = false
actions_enabled = true
allowed_actions = "all"
sha_pinning_required = false
branch_ruleset_name = "Valkyoth Protect Main Branch"
tag_ruleset_required = false
secret_scanning = "disabled"
secret_scanning_push_protection = "disabled"
self_hosted_runner_count = 0
visible_self_hosted_runner_group_count = 0
expected_branch_bypass_actors = [
    { actor_type = "OrganizationAdmin", bypass_mode = "always" },
    { actor_type = "User", actor_id = 1921261, bypass_mode = "always" },
]
trusted_publishing = false
publication_driver = "scripts/release_crates.py"
independent_pentest = false

[ownership]
code_owner = "@eldryoth"
required_crates_io_owner = "eldryoth"

[packages]
publishable = [
    "cloud-sdk-sanitization",
    "cloud-sdk",
    "cloud-sdk-reqwest",
    "cloud-sdk-testkit",
    "cloud-sdk-hetzner",
]
excluded = [
    "cloud-sdk-fuzz",
    "cloud-sdk-prepared-coverage-check",
    "cloud-sdk-reqwest-feature-unification-test",
    "ovhcloud-v2-probe",
]

[workflows]
files = ["ci.yml", "hetzner-api-drift.yml"]
