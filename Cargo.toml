[workspace]
members = [
    "crates/cloud-sdk",
    "crates/cloud-sdk-hetzner",
    "crates/cloud-sdk-reqwest",
    "crates/cloud-sdk-sanitization",
    "crates/cloud-sdk-testkit",
    "provider-probes/ovhcloud-v2/harness",
]
exclude = ["fuzz", "tools/prepared-coverage-check"]
default-members = ["crates/cloud-sdk"]
resolver = "3"

[workspace.package]
version = "0.96.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/valkyoth/cloud-sdk"
repository = "https://github.com/valkyoth/cloud-sdk"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
panic = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
undocumented_unsafe_blocks = "forbid"
indexing_slicing = "forbid"
arithmetic_side_effects = "forbid"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

[workspace.dependencies]
aws-lc-rs = { version = "=1.18.0", default-features = false }
aws-lc-sys = { version = "=0.44.0", default-features = false }
base64-ng = { version = "=2.0.1", default-features = false }
bytes = { version = "1.12.1", default-features = false }
http = { version = "1.5.0", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.11.0", default-features = false }
hyper-rustls = { version = "0.27.9", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
md-5 = { version = "=0.11.0", default-features = false }
cloud-sdk = { path = "crates/cloud-sdk", version = "0.96.0", default-features = false }
cloud-sdk-hetzner = { path = "crates/cloud-sdk-hetzner", version = "0.46.0" }
cloud-sdk-reqwest = { path = "crates/cloud-sdk-reqwest", version = "0.36.0" }
cloud-sdk-sanitization = { path = "crates/cloud-sdk-sanitization", version = "0.19.0", default-features = false }
cloud-sdk-testkit = { path = "crates/cloud-sdk-testkit", version = "0.31.0" }
reqwest = { version = "=0.13.4", default-features = false }
rustls = { version = "=0.23.43", default-features = false }
rustls-platform-verifier = { version = "=0.7.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
webpki-roots = { version = "=1.0.9", default-features = false }
tokio = { version = "1.53.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
sanitization = { version = "2.0.3", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }

[profile.release]
overflow-checks = true
panic = "abort"
