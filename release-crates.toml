change = "code"
publish = true
reason = "Remove the obsolete transport-owned Hetzner-shaped rate-limit parser and error variant."

[crates."cloud-sdk-sanitization"]
previous_version = "0.16.0"
version = "0.16.0"
change = "unchanged"
publish = false
reason = "No code, dependency, or package metadata changes."

[crates."cloud-sdk-testkit"]
previous_version = "0.25.1"
version = "0.25.2"
change = "dependency"
publish = true
reason = "Update the cloud-sdk dependency to the v0.45 facade line."
