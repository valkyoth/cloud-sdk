[release]
version = "0.45.0"
policy = "independent"

[crates."cloud-sdk"]
previous_version = "0.44.0"
version = "0.45.0"
change = "code"
publish = true
reason = "Add bounded provider-neutral quota buckets, Retry-After parsing, and pure delay decisions."

[crates."cloud-sdk-hetzner"]
previous_version = "0.34.0"
version = "0.35.0"
change = "code"
publish = true
reason = "Move Hetzner quota decoding into the provider and retain quota on checked success and error responses."

[crates."cloud-sdk-reqwest"]
previous_version = "0.30.1"
